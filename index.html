<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battlezone</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
  #error { position: fixed; color: #3f6; font: 20px monospace; }
</style>
</head>
<body>
<canvas id="screen" width="1920" height="1080"></canvas>
<div id="error"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
